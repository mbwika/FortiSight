name = "codensecurity"
main = "worker.js"
compatibility_date = "2024-01-01"

[vars]
# Add any environment variables here if needed

# For email service API keys, use secrets instead
# wrangler secret put RESEND_API_KEY
# wrangler secret put TURNSTILE_SECRET_KEY

[assets]
directory = "./build"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

# Workers with static assets must route on the whole domain. worker.js itself
# dispatches /api/* to handlePostRequest and serves the main site shell for
# everything else on codensecurity.com.
[[routes]]
pattern = "codensecurity.com/*"
zone_name = "codensecurity.com"
